name: Snapshot HearHam repeaters

# Downloads the public HearHam.live repeater list (the source the earlier HamDash app used), keeps the
# listings near Chornobyl and pushes the result to the hearham-snapshot branch for review. It does not touch
# the app's bundled catalog: copying entries into app/src/main/assets/catalog.json stays a reviewed commit.

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and filter the list
        run: python3 tools/hearham_snapshot.py "$RUNNER_TEMP/hearham-near-chornobyl.json"
      - name: Save BrandMeister network devices near Chornobyl for review
        continue-on-error: true
        run: |
          python3 - <<'PY2'
          import json, math, os, urllib.request
          req = urllib.request.Request("https://api.brandmeister.network/v2/device", headers={"User-Agent": "ChornobylHamDash-snapshot/1.0"})
          devices = json.load(urllib.request.urlopen(req, timeout=180))
          print(f"BrandMeister: {len(devices)} devices; fields of the first: {sorted(devices[0])}")
          def near(d):
              try:
                  lat, lon = float(d.get("lat") or 0), float(d.get("lng") or 0)
              except (TypeError, ValueError):
                  return False
              if lat == 0 and lon == 0:
                  return False
              p1, p2 = math.radians(51.2763), math.radians(lat)
              h = math.sin((p2 - p1) / 2) ** 2 + math.cos(p1) * math.cos(p2) * math.sin(math.radians(lon - 30.2219) / 2) ** 2
              return 2 * 6371 * math.asin(math.sqrt(h)) <= 300
          kept = [d for d in devices if near(d)]
          print(f"{len(kept)} devices within 300 km")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "brandmeister-near-chornobyl.json"), "w") as f:
              json.dump(kept, f, ensure_ascii=False, indent=1)
          PY2
      - name: Push the snapshot to the hearham-snapshot branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan hearham-snapshot
          git rm -rfq .
          cp "$RUNNER_TEMP"/*-near-chornobyl.json .
          git add ./*-near-chornobyl.json
          git commit -qm "HearHam.live repeaters near Chornobyl, retrieved $(date -u +%F)"
          git push -f origin hearham-snapshot
