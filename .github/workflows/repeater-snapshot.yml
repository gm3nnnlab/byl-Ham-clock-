name: Snapshot public repeater lists

# Downloads the public HearHam.live repeater list and the BrandMeister DMR device list, keeps repeaters near
# Chornobyl (tools/repeater_snapshot.py) and pushes the result to the repeater-snapshot branch for review.
# It does not touch the app: copying entries into app/src/main/assets/catalog.json stays a reviewed commit.

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 tools/test_repeater_snapshot.py
      - name: Download and filter the lists
        run: python3 tools/repeater_snapshot.py "$RUNNER_TEMP/repeaters-near-chornobyl.json"
      - name: Push the snapshot to the repeater-snapshot branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan repeater-snapshot
          git rm -rfq .
          cp "$RUNNER_TEMP/repeaters-near-chornobyl.json" .
          git add repeaters-near-chornobyl.json
          git commit -qm "Public repeater listings near Chornobyl, retrieved $(date -u +%F)"
          git push -f origin repeater-snapshot
