name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to create and publish as a release, for example v0.1.0. Leave empty for a plain build.
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
      - name: Check the APK is signed with the repository debug key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signer.txt
          EXPECTED=$(tr -d '[:space:]' < keystore/debug-cert-sha256.txt)
          if ! grep -qi "certificate SHA-256 digest: ${EXPECTED}" signer.txt; then
            echo "::error::The APK is not signed with keystore/debug.keystore (expected SHA-256 ${EXPECTED}). Updates would fail to install over earlier builds."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chornobyl-hamdash-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed release APK and App Bundle
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew :app:assembleRelease :app:bundleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee release-signer.txt
          EXPECTED=$(tr -d '[:space:]' < keystore/release-cert-sha256.txt)
          if ! grep -qi "certificate SHA-256 digest: ${EXPECTED}" release-signer.txt; then
            echo "::error::The release APK is not signed with the release key listed in keystore/release-cert-sha256.txt (expected ${EXPECTED}). Check the RELEASE_* secrets."
            exit 1
          fi
      - name: Name the files after the release tag
        if: env.IS_RELEASE == 'true'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "chornobyl-hamdash-${RELEASE_TAG}-debug.apk"
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "chornobyl-hamdash-${RELEASE_TAG}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "chornobyl-hamdash-${RELEASE_TAG}.aab"
          fi
      - name: Publish GitHub release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            chornobyl-hamdash-${{ env.RELEASE_TAG }}.apk
            chornobyl-hamdash-${{ env.RELEASE_TAG }}.aab
            chornobyl-hamdash-${{ env.RELEASE_TAG }}-debug.apk
          prerelease: true
          body: |
            Chornobyl HamDash ${{ env.RELEASE_TAG }}.

            * `chornobyl-hamdash-${{ env.RELEASE_TAG }}.apk`: release build signed with the project's release key (use this one).
            * `chornobyl-hamdash-${{ env.RELEASE_TAG }}.aab`: the same build as an Android App Bundle for Google Play.
            * `chornobyl-hamdash-${{ env.RELEASE_TAG }}-debug.apk`: test build signed with the public debug key in `keystore/debug.keystore`.

            The release and debug builds use different keys, so Android will not install one over the other.
            Release key SHA-256: see `keystore/release-cert-sha256.txt`.
