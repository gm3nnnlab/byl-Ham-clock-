name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chornobyl-hamdash-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Name the APK after the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk "chornobyl-hamdash-${GITHUB_REF_NAME}-debug.apk"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: chornobyl-hamdash-${{ github.ref_name }}-debug.apk
          prerelease: true
          body: |
            Debug build of Chornobyl HamDash ${{ github.ref_name }}.
            Signed with the debug key, intended for testing. Install it by allowing installs from unknown sources.
