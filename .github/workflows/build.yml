name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to create and publish as a release, for example v0.1.0. Leave empty for a plain build.
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chornobyl-hamdash-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Name the APK after the release tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "chornobyl-hamdash-${RELEASE_TAG}-debug.apk"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: chornobyl-hamdash-${{ inputs.release_tag || github.ref_name }}-debug.apk
          prerelease: true
          body: |
            Debug build of Chornobyl HamDash ${{ inputs.release_tag || github.ref_name }}.
            Signed with the debug key, intended for testing. Install it by allowing installs from unknown sources.
